<!DOCTYPE html>
<!--
NOTAS DEL ARCHIVO (todas las notas van aquí arriba)

1. MARCA: "Hogar Hogareña". Sitio de una inmobiliaria con listado de propiedades en Lima.
   Contacto por WhatsApp y teléfono: 51903307861 (se cambia en la constante WA, al final del archivo, en el bloque de JavaScript).

2. COLORES (solo 3, en todo el sitio):
   - Color 1: negro  #1a1a1a  hsl(0, 0%, 10%)    -> fondo y textos sobre verde
   - Color 2: verde  #14eb4a  hsl(135, 84%, 50%) -> acentos, botones, bordes activos
   - Color 3: blanco #e8fded  hsl(135, 84%, 95%) -> textos y contornos
   Los grises/transparencias son el blanco o el verde con opacidad (rgba), no colores nuevos.
   Estilo: modo oscuro.

3. DISEÑO (basado en la captura de referencia):
   - Barra de filtros: Ubicaciones, Alquilar/Comprar, Departamento (antes "Inmueble"), Precio y Más filtros.
     Los 5 tienen el mismo tamaño y forma squircle, con su ícono pegado a la derecha.
   - Filtros desplegables (Alquilar/Comprar, Departamento, Precio, Más filtros): al hacer clic se abre debajo
     un squircle solo con las opciones (sin título), el ∨ pasa a ∧ y al elegir se cierra. Más filtros permite
     marcar varias comodidades y queda abierto. Al seleccionar un filtro solo cambia el color del borde
     (no hay segundo contorno). Se maneja también con teclado (flechas y Esc).
   - Precio: al abrirlo sale "Cualquier precio" y debajo la moneda (USD primero, Soles a la derecha; por defecto USD)
     y dos casillas Desde / Hasta. Solo aceptan números. "Cualquier precio" sigue elegido hasta que se escribe un monto y se pulsa "Ver resultados" (el rango no filtra antes). Al hacer clic en una casilla desaparece su texto guía y su
     borde pasa a color 3 (blanco). Si la propiedad está en otra moneda se convierte con el tipo de cambio TC (en el JavaScript).
   - Debajo: cantidad de resultados, botón "Ordenar" y la lista de propiedades.
   - "Ordenar" es un desplegable del mismo estilo que los filtros, con 2 opciones: Menor precio y Mayor precio.
     El texto del botón siempre dice "Ordenar" (no cambia). Por defecto está elegido Mayor precio.
   - Mapa a la derecha: alto, pegado (sticky) y ocupa todo el alto de la pantalla.
   - Línea de la cabecera y botón de llamada: color 3 (blanco). El botón de WhatsApp sigue en verde.
   - Tarjeta de arriba (#sel): muestra la propiedad del mapa. Cambia con solo pasar el mouse por un precio
     (o tocarlo), sin necesidad de seleccionarlo; la última queda elegida (pin verde) hasta pasar por otro.
     La página nunca se desplaza por esto: el contenedor conserva su alto para que lo de abajo no se mueva.
     Las tarjetas de abajo (#list) son todo lo que se publica; la de arriba solo es una vista de la elegida.
     Al abrir la página muestra la primera de la lista. Si la elegida queda fuera por los filtros, pasa a
     mostrar la primera que quede.
   - Al pasar el mouse por una tarjeta de abajo se resalta su pin en el mapa.
   - Se quitaron: el botón "Crear alerta", la franja verde de la foto (ej. "Entrega inmediata")
     y la etiqueta "Destacado".

4. MAPA REAL: usa Leaflet (cdnjs) con mapa oscuro de CARTO sobre datos de OpenStreetMap.
   Centro: Lima (CENTRO = [-12.0464, -77.0428]), zoom 12. Necesita internet para cargar el mapa.
   Cada propiedad lleva sus coordenadas `lat` y `lng`; de ahí salen los pines con precio.
   Los mapas de CARTO/OSM son gratis para uso liviano; si la web tiene mucho tráfico conviene
   revisar sus condiciones de uso o cambiar de proveedor.
   El botón "Ver mapa" abre Google Maps en otra pestaña.

5. PROPIEDADES: están en la lista `props` del JavaScript final. Los datos son de ejemplo; reemplázalos por los reales.
   Cada una usa una imagen (depto1.webp ... depto6.webp). Sin imagen se ve un recuadro de aviso.
   Los filtros funcionan con esos datos (tipo, alquiler/venta, precio máximo, ubicación y comodidades).

6. SECCIONES ANTERIORES: la versión anterior tenía 3 secciones (captar propietarios, conseguir
   compradores, conseguir inquilinos) dentro de una página de venta. Esta versión las reemplaza
   por el listado de propiedades.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hogar Hogareña | Departamentos en alquiler y venta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --negro:#1a1a1a; --verde:#14eb4a; --blanco:#e8fded;
  --linea:rgba(232,253,237,.2); --suave:rgba(232,253,237,.66); --verde-t:rgba(20,235,74,.14);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--negro);color:var(--blanco);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
.wrap{width:min(1320px,100% - 48px);margin-inline:auto}

/* cabecera */
.top{border-bottom:1px solid var(--blanco)}
.top .wrap{height:72px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:12px;font:800 24px var(--display);letter-spacing:-.03em}

/* filtros: los 5 del mismo tamaño, ícono a la derecha */
.filters{position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0}
.f{position:relative}
.dd{position:relative}
.dd.open{z-index:60}
.sq{display:block;width:100%;height:60px;margin:0;padding:0 52px 0 20px;text-align:left;cursor:pointer;
  background:var(--negro);color:var(--blanco);border:1px solid var(--linea);border-radius:20px;corner-shape:squircle;
  font:600 16px var(--body);appearance:none;-webkit-appearance:none;transition:border-color .2s}
/* al seleccionar solo cambia el color del borde, sin segundo contorno */
.sq,.sq:focus,.sq:focus-visible{outline:none}
.sq:hover,.sq:focus-visible,input.sq:focus,.dd.open .sq,.dd.open .ob{border-color:var(--verde)}
.sq::placeholder{color:var(--blanco);opacity:1}
.sq .lbl{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.f>svg{position:absolute;right:18px;top:50%;translate:0 -50%;width:20px;height:20px;pointer-events:none}
.chev{transition:rotate .2s}
.f.open .chev{rotate:180deg}
/* lista de opciones: squircle debajo del filtro */
.panel{position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:100%;width:max-content;max-width:min(340px,calc(100vw - 48px));padding:8px;
  display:grid;gap:2px;background:var(--negro);border:1px solid var(--linea);border-radius:22px;corner-shape:squircle;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.9);opacity:0;visibility:hidden;translate:0 -6px;transition:opacity .15s,translate .15s,visibility .15s}
.dd.open .panel{opacity:1;visibility:visible;translate:0 0}
.dd-orden .panel{left:auto;right:0;min-width:100%}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:14px;corner-shape:squircle;background:none;
  color:var(--blanco);font:500 16px var(--body);text-align:left;white-space:nowrap;cursor:pointer}
.opt:hover,.opt:focus-visible{background:rgba(232,253,237,.08);outline:none}
.radio,.check{flex:none;display:grid;place-items:center;width:24px;height:24px;border:2px solid var(--blanco)}
.radio{border-radius:50%}
.check{border-radius:7px}
.opt[aria-selected="true"] .radio{border-color:var(--verde)}
.opt[aria-selected="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
.opt[aria-selected="true"] .check{border-color:var(--verde);background:var(--verde)}
.opt[aria-selected="true"] .check::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid var(--negro);border-width:0 2.5px 2.5px 0;rotate:45deg}
/* panel de Precio: moneda (USD / Soles) y casillas Desde / Hasta */
#dd-precio .panel{min-width:280px}
#dd-tipo .panel{max-height:calc(100vh - 110px);overflow-y:auto;overscroll-behavior:contain} /* salen todos los tipos; solo en pantallas muy bajas aparece scroll */
.mons{display:flex;gap:22px;padding:10px 14px 6px}
.mo{display:flex;align-items:center;gap:10px;padding:0;border:0;background:none;color:var(--blanco);font:500 16px var(--body);cursor:pointer}
.mo[aria-selected="true"] .radio{border-color:var(--verde)}
.mo[aria-selected="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
.rango{display:flex;gap:10px;padding:6px 6px 8px}
.num{flex:1 1 0;min-width:0;width:100%;height:52px;padding:0 14px;background:var(--negro);color:var(--blanco);border:1px solid var(--linea);
  border-radius:16px;corner-shape:squircle;font:500 16px var(--body);appearance:none;-webkit-appearance:none;transition:border-color .2s}
.ver{display:block;width:calc(100% - 12px);height:48px;margin:0 6px 6px;cursor:pointer;background:var(--negro);color:var(--blanco);border:1px solid var(--blanco);border-radius:14px;corner-shape:squircle;font:600 16px var(--body);transition:background .2s}
.ver:hover,.ver:focus-visible{background:rgba(232,253,237,.08);outline:none}
.num::placeholder{color:var(--suave);opacity:1}
/* al hacer clic: el texto guía desaparece y el borde pasa a color 3 */
.num:focus,.num:focus-visible{outline:none;border-color:var(--blanco)}
.num:focus::placeholder{color:transparent}

/* cuerpo */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start;padding-bottom:64px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.bar h1{margin:0;font:600 20px/1.3 var(--body)}
.bar .btns{display:flex;gap:12px}
.ob{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 18px;cursor:pointer;background:var(--negro);
  border:1px solid var(--linea);border-radius:16px;corner-shape:squircle;font-weight:600;transition:border-color .2s}
.ob:hover,.ob:focus-visible{border-color:var(--verde);outline:none}
.ob svg{width:20px;height:20px}
.list{display:grid;gap:20px}
.card{position:relative;display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);min-height:340px;overflow:hidden;
  border:1px solid var(--linea);border-radius:28px;corner-shape:squircle;transition:border-color .2s}
.card:hover,.card.on{border-color:var(--verde)}
.card.on{box-shadow:0 0 0 1px var(--verde)}
#sel{margin-bottom:28px}
#sel[hidden]{display:none}
.card.top{border-color:var(--verde);scroll-margin-top:20px}
.card.cambia{animation:entra .3s ease}
@keyframes entra{from{opacity:.4}to{opacity:1}}
.selnota{margin:0;color:var(--verde);font-weight:600;font-size:14px}
.pic{position:relative;overflow:hidden}
.pic img,.pic .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(232,253,237,.04) 0 12px,transparent 12px 24px),linear-gradient(160deg,rgba(20,235,74,.3),var(--negro))}
.ph span{padding:8px 14px;border:1px dashed var(--suave);border-radius:999px;font-size:13px;color:var(--suave)}
.body{display:flex;flex-direction:column;gap:8px;min-width:0;padding:24px}
.eyebrow{margin:0;color:var(--suave);font-size:14px}
.price{margin:0;font:800 34px/1.05 var(--display);letter-spacing:-.03em}
.spec{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0 2px;font-weight:500}
.addr{margin:8px 0 0;font-weight:700}
.zona{margin:0;color:var(--suave)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chips span{padding:2px 12px;border:1px solid var(--linea);border-radius:8px;font-size:13px}
.desc{margin:4px 0 0;color:var(--suave);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:16px;border-top:1px solid var(--linea)}
.acts{display:flex;gap:10px}
.ib,.wa{height:50px;border-radius:16px;corner-shape:squircle}
.ib{width:50px;display:grid;place-items:center;border:1px solid var(--blanco);color:var(--blanco)}
.wa{display:inline-flex;align-items:center;gap:10px;padding:0 20px;background:var(--verde);color:var(--negro);font-weight:700}
.ib svg,.wa svg{width:22px;height:22px}
.heart{position:absolute;top:18px;right:20px;display:grid;place-items:center;width:36px;height:36px;padding:0;background:none;border:0;cursor:pointer}
.heart svg{width:28px;height:28px;fill:none;stroke:var(--blanco);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.heart[aria-pressed="true"] svg{fill:var(--verde);stroke:var(--verde)}
.vacio{padding:48px 24px;text-align:center;border:1px dashed var(--linea);border-radius:28px;corner-shape:squircle;color:var(--suave)}
.vacio a{color:var(--verde);font-weight:600}

/* mapa real, alto y pegado */
.map{position:sticky;top:20px;isolation:isolate;display:flex;flex-direction:column;height:calc(100vh - 40px);min-height:520px;overflow:hidden;
  border:1px solid var(--linea);border-radius:28px;corner-shape:squircle}
.canvas{position:relative;flex:1;min-height:0;background:var(--negro)}
#mapa{position:absolute;inset:0;background:var(--negro);font-family:var(--body)}
.pinwrap{background:none;border:0}
.pin{position:absolute;left:0;top:0;translate:-50% calc(-100% - 7px);padding:5px 11px;border-radius:999px;background:var(--blanco);color:var(--negro);font:700 13px var(--body);white-space:nowrap;cursor:pointer;transition:background .2s,scale .2s}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;translate:-50% 0;border:6px solid transparent;border-bottom:0;border-top-color:var(--blanco)}
.pin.on,.pin:hover{background:var(--verde);scale:1.12}
.pin.on::after,.pin:hover::after{border-top-color:var(--verde)}
.pin.sel{background:var(--verde)}
.pin.sel::after{border-top-color:var(--verde)}
.leaflet-bar,.leaflet-bar a{border-color:var(--linea)!important}
.leaflet-bar a{background:var(--negro)!important;color:var(--blanco)!important}
.leaflet-bar a:hover{color:var(--verde)!important}
.leaflet-control-attribution{background:rgba(26,26,26,.85)!important;color:var(--suave)!important}
.leaflet-control-attribution a{color:var(--verde)!important}
.vm{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-top:1px solid var(--linea);font-weight:700;transition:color .2s}
.vm:hover{color:var(--verde)}
.vm svg{width:20px;height:20px}

@media(max-width:1000px){
  .layout{grid-template-columns:1fr}
  .map{order:-1;position:relative;top:0;height:340px;min-height:0}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .f:first-child{grid-column:1/-1}
  .filters .f:nth-child(n+3):nth-child(odd) .panel{left:auto;right:0}
  #dd-precio .panel{left:auto;right:0}
}
@media(max-width:640px){
  .card{grid-template-columns:1fr}
  .pic{min-height:230px}
  .price{font-size:30px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.card.cambia{animation:none}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a href="#" class="logo" aria-label="Hogar Hogareña, inicio"><svg width="46" height="37" aria-hidden="true" viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#14eb4a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="17" d="M16 112 162 20 312 112"/><path d="M56 124V261H240M274 124V215"/><rect x="70" y="136" width="88" height="82"/><path d="M114 136V218M70 177H158"/><path d="M190 261V136H254V261"/></g><path fill="#14eb4a" d="M236 276C228 270 230 258 240 254C238 244 248 234 260 236C262 218 270 206 288 206C304 206 312 218 310 230C324 226 338 236 336 248C348 252 350 268 340 274C336 278 332 278 326 278Z"/></svg>Hogar Hogareña</a>

<main class="wrap">
  <div class="filters" role="search">
    <div class="f">
      <input class="sq" id="ubi" type="text" placeholder="Ubicaciones" autocomplete="off" aria-label="Ubicaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <div class="panel" role="listbox" aria-label="Tipo de propiedad"></div>

      <button class="sq" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Precio"><span class="lbl"></span></button>

      <div class="panel" role="group" aria-label="Precio">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <div class="panel" role="listbox" aria-label="Más filtros" aria-multiselectable="true"></div>
    </div>
  </div>

  <div class="layout">
    <section aria-label="Resultados">
      <div id="sel" hidden aria-live="polite"></div>
      <div class="bar">
        <h1 id="titulo" aria-live="polite"></h1>
        <div class="btns">
          <div class="dd dd-orden" id="dd-orden">
            <button class="ob" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="lbl">Ordenar</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/></svg></button>
            <div class="panel" role="listbox" aria-label="Ordenar"></div>

      <div class="list" id="list"></div>
    </section>

    <aside class="map" aria-label="Mapa de propiedades">
      <div class="canvas"><div id="mapa" role="application" aria-label="Mapa de Lima con las propiedades"></div></div>
      <a class="vm" href="https://www.google.com/maps/search/departamentos+en+alquiler+Lima" target="_blank" rel="noopener">Ver mapa
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
    </aside>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const WA='51903307861';
const CENTRO=[-12.0464,-77.0428]; // centro de Lima
const props=[
 {id:1,img:'depto1.webp',op:'alquiler',tipo:'Departamento',precio:2350,mon:'S/',un:12,dorm:'1 a 2 dorm.',m2:'45 a 61 m² tot.',dir:'Av. Brasil 1840',zona:'Jesús María, Lima',am:['Gimnasio','Piscina','Parrilla','Áreas verdes'],desc:'Departamentos de 1 y 2 dormitorios diseñados para brindar comodidad, ubicación y seguridad cerca del centro de Lima.',lat:-12.0700,lng:-77.0530},
 {id:2,img:'depto2.webp',op:'alquiler',tipo:'Departamento',precio:2800,mon:'S/',un:8,dorm:'2 dorm.',m2:'58 a 64 m² tot.',dir:'Av. Larco 1150',zona:'Miraflores, Lima',am:['Gimnasio','Parrilla'],desc:'Ven a conocer nuestros departamentos de estreno de 2 dormitorios con balcón y excelente iluminación natural.',lat:-12.1190,lng:-77.0300},
 {id:3,img:'depto3.webp',op:'alquiler',tipo:'Departamento',precio:1900,mon:'S/',un:20,dorm:'1 dorm.',m2:'38 a 45 m² tot.',dir:'Jr. Cusco 450',zona:'Cercado de Lima, Lima',am:['Áreas verdes'],desc:'Departamentos de 1 dormitorio, ideales para una persona o pareja, cerca de universidades y comercios.',lat:-12.0453,lng:-77.0311},
 {id:4,img:'depto4.webp',op:'alquiler',tipo:'Departamento',precio:3600,mon:'S/',un:6,dorm:'3 dorm.',m2:'85 a 98 m² tot.',dir:'Av. Camino Real 1050',zona:'San Isidro, Lima',am:['Piscina','Parrilla','Áreas verdes'],desc:'Amplios departamentos familiares de 3 dormitorios con cochera y zona de parrillas en la azotea.',lat:-12.1000,lng:-77.0380},
 {id:5,img:'depto5.webp',op:'venta',tipo:'Departamento',precio:135000,mon:'US$',un:10,dorm:'2 dorm.',m2:'60 a 72 m² tot.',dir:'Av. Sucre 760',zona:'Magdalena del Mar, Lima',am:['Gimnasio','Áreas verdes'],desc:'Departamentos en venta con acabados modernos y facilidades de pago con crédito hipotecario.',lat:-12.0900,lng:-77.0710},
 {id:6,img:'depto6.webp',op:'venta',tipo:'Casa',precio:320000,mon:'US$',un:1,dorm:'4 dorm.',m2:'180 m² tot.',dir:'Jr. Domeyer 280',zona:'Barranco, Lima',am:['Parrilla','Áreas verdes'],desc:'Casa de dos pisos con jardín, cochera para dos autos y terraza con parrilla.',lat:-12.1400,lng:-77.0200}
];
const plural={Departamento:'departamentos',Casa:'casas',Terreno:'terrenos','Local comercial':'locales comerciales',Oficina:'oficinas',Cochera:'cocheras','Local industrial':'locales industriales'};
const TC=3.75; // tipo de cambio: soles por 1 dólar (para comparar propiedades de otra moneda con el rango)
const I={
 heart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg>',
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.9 2.100c.1.200.1.400 0 .600l-.4.600c-.2.200-.3.400-.1.700.2.300.8 1.300 1.800 2.100 1.200 1 2.200 1.300 2.500 1.500.3.100.5.100.7-.1l.9-1.100c.2-.3.400-.2.700-.1l2 1c.3.100.5.200.6.300.1.200.1.800-.1 1.500z"/></svg>'
};
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
const wa=t=>'https://wa.me/'+WA+'?text='+encodeURIComponent(t);
const estado={op:'alquiler',tipo:'Departamento',mon:'USD',desde:0,hasta:0,am:[],orden:-1}; // orden: -1 = mayor precio (por defecto), 1 = menor precio
let fav=new Set(), mapa=null, capa=null, marcas={}, visibles=[], selId=null;

/* mapa real: Leaflet + mapa oscuro de CARTO (datos de OpenStreetMap), centrado en Lima */
function iniciarMapa(){
  if(!window.L)return;
  mapa=L.map('mapa',{center:CENTRO,zoom:12,dragging:!L.Browser.mobile});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'}).addTo(mapa);
  capa=L.layerGroup().addTo(mapa);
  setTimeout(()=>mapa.invalidateSize(),0);
  addEventListener('resize',()=>{mapa.invalidateSize();$('#sel').style.minHeight=''});
}
function pintar(r){
  if(!mapa)return;
  capa.clearLayers();marcas={};
  r.forEach(p=>{
    const m=L.marker([p.lat,p.lng],{keyboard:false,icon:L.divIcon({className:'pinwrap',iconSize:[0,0],html:`<span class="pin">${p.mon} ${fmt(p.precio)}</span>`})}).addTo(capa);
    const pin=m.getElement().querySelector('.pin');
    if(p.id===selId)pin.classList.add('sel');
    // al pasar el mouse (o tocar) un precio, la tarjeta de arriba cambia a esa propiedad; la página no se mueve
    pin.addEventListener('pointerenter',()=>elegir(p.id));
    m.on('click',()=>elegir(p.id));
    marcas[p.id]=m;
  });
}
function resaltar(id,on){
  const m=marcas[id];if(!m)return;
  const el=m.getElement();if(el&&el.querySelector('.pin'))el.querySelector('.pin').classList.toggle('on',on);
  m.setZIndexOffset(on?1000:0);
}

/* tarjeta de arriba: la propiedad elegida en el mapa */
function elegir(id){
  if(id===selId)return;
  selId=id;
  Object.keys(marcas).forEach(k=>{const el=marcas[k].getElement().querySelector('.pin');if(el)el.classList.toggle('sel',+k===id)});
  mostrarSel(true);
}
function mostrarSel(animar){
  const box=$('#sel'),p=visibles.find(x=>x.id===selId);
  box.hidden=!p;
  box.innerHTML=p?cardHTML(p,true):'';
  if(p&&animar)box.firstElementChild.classList.add('cambia');
  // el contenedor conserva el alto mayor visto, así la lista de abajo no se mueve al cambiar de propiedad
  box.style.minHeight=p?Math.max(parseFloat(box.style.minHeight)||0,box.offsetHeight)+'px':'';
}

const cardHTML=(p,top)=>`
    <article class="card${top?' top':''}" data-pid="${p.id}"${top?'':` data-id="${p.id}"`}>
      <div class="pic">
        <div class="ph"><span>IMAGEN: ${p.img}</span></div>
        <img src="${p.img}" alt="${p.tipo} en ${p.zona}" loading="lazy" onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="this.remove()">
      </div>
      <div class="body">
        <button class="heart" type="button" aria-label="Guardar en favoritos" aria-pressed="${fav.has(p.id)}">${I.heart}</button>
        ${top?'<p class="selnota">Seleccionado en el mapa</p>':''}
        <p class="eyebrow">${plural[p.tipo]} desde</p>
        <p class="price">${p.mon} ${fmt(p.precio)}</p>
        <div class="spec"><span>${p.un} un.</span><span>${p.dorm}</span><span>${p.m2}</span></div>
        <p class="addr">${p.dir}</p>
        <p class="zona">${p.zona}</p>
        <div class="chips">${p.am.map(a=>`<span>${a}</span>`).join('')}</div>
        <p class="desc">${p.desc}</p>
        <div class="foot">
          <div class="acts">
            <a class="ib" href="tel:+${WA}" aria-label="Llamar">${I.phone}</a>
            <a class="wa" href="${wa(`Hola, me interesa el ${p.tipo.toLowerCase()} en ${p.op}: ${p.dir}, ${p.zona}`)}" target="_blank" rel="noopener">WhatsApp ${I.wa}</a>
          </div>
        </div>
      </div>
    </article>`;

// precio de la propiedad expresado en la moneda elegida (USD o PEN)
const valorEn=(p,m)=>{const usd=p.mon==='US$';return m==='USD'?(usd?p.precio:p.precio/TC):(usd?p.precio*TC:p.precio)};
function render(){
  const {op,tipo,desde,hasta,mon,am}=estado, q=$('#ubi').value.trim().toLowerCase();
  const r=props.filter(p=>p.op===op&&p.tipo===tipo&&(!desde||valorEn(p,mon)>=desde)&&(!hasta||valorEn(p,mon)<=hasta)&&(!q||(p.dir+' '+p.zona).toLowerCase().includes(q))&&am.every(a=>p.am.includes(a)));
  r.sort((a,b)=>(a.precio-b.precio)*estado.orden);
  visibles=r;
  if(!r.some(x=>x.id===selId))selId=r.length?r[0].id:null;
  const nom=r.length===1?tipo.toLowerCase():plural[tipo];
  $('#titulo').textContent=`${r.length} ${nom} en ${op} en Lima`;
  $('#list').innerHTML=r.length?r.map(p=>cardHTML(p,false)).join(''):
    `<div class="vacio">No hay propiedades con estos filtros. Cambia la búsqueda o <a href="${wa('Hola, busco una propiedad en Lima y no la encuentro en la página')}" target="_blank" rel="noopener">escríbenos por WhatsApp</a>.</div>`;
  pintar(r);
  mostrarSel(false);
}

/* filtros desplegables: se abren debajo, el ∨ pasa a ∧ y las opciones salen en un squircle */
const AM=['Gimnasio','Piscina','Parrilla','Áreas verdes'];
const DD={
  op:{opts:()=>[['Alquilar','alquiler'],['Comprar','venta'],['Proyectos','proyecto']]},
  tipo:{opts:()=>[['Departamento','Departamento'],['Casa','Casa'],['Terreno','Terreno'],['Oficina','Oficina'],['Local comercial','Local comercial'],['Local industrial','Local industrial'],['Cochera | Garaje','Cochera']]},
  mas:{multi:true,opts:()=>AM.map(a=>[a,a])},
  orden:{fijo:true,opts:()=>[['Mayor precio',-1],['Menor precio',1]]} // el texto "Ordenar" no cambia
};
function dibujar(k){
  const d=DD[k],box=$('#dd-'+k),opts=d.opts();
  const on=v=>d.multi?estado.am.includes(v):estado[k]===v;
  box.querySelector('.panel').innerHTML=opts.map(([t,v],i)=>`<button class="opt" type="button" role="option" aria-selected="${on(v)}" data-i="${i}"><span class="${d.multi?'check':'radio'}"></span>${t}</button>`).join('');
  if(d.fijo)return;
  const l=box.querySelector('.lbl');
  l.textContent=k==='mas'?'Más filtros'+(estado.am.length?` (${estado.am.length})`:''):
    opts.find(o=>o[1]===estado[k])[0];
}
const btn=f=>f.querySelector(':scope > button');
function cerrar(){document.querySelectorAll('.dd.open').forEach(f=>{f.classList.remove('open');btn(f).setAttribute('aria-expanded','false')})}
function alternar(k){
  const f=$('#dd-'+k),abrir=!f.classList.contains('open');
  cerrar();
  if(abrir){f.classList.add('open');btn(f).setAttribute('aria-expanded','true')}
}
Object.keys(DD).forEach(k=>{
  dibujar(k);
  const f=$('#dd-'+k);
  btn(f).addEventListener('click',()=>alternar(k));
  f.querySelector('.panel').addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b)return;
    const v=DD[k].opts()[+b.dataset.i][1];
    if(DD[k].multi){const x=estado.am.indexOf(v);x<0?estado.am.push(v):estado.am.splice(x,1)}
    else{estado[k]=v}
    dibujar(k);
    if(!DD[k].multi){cerrar();btn(f).focus()}
    render();
  });
  f.addEventListener('keydown',e=>{
    if(e.key==='Escape'){cerrar();btn(f).focus();return}
    if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
    e.preventDefault();
    if(!f.classList.contains('open'))alternar(k);
    const o=[...f.querySelectorAll('.opt')],i=o.indexOf(document.activeElement);
    o[e.key==='ArrowDown'?Math.min(i+1,o.length-1):Math.max(i-1,0)].focus();
  });
});
/* Precio: "Cualquier precio" queda elegido siempre, salvo que se escriba un monto y se pulse "Ver resultados" */
(function(){
  const f=$('#dd-precio'),desde=$('#p-desde'),hasta=$('#p-hasta'),any=$('#p-any'),ver=$('#p-ver'),lbl=f.querySelector('.lbl');
  let monB=estado.mon; // moneda marcada en el panel (se aplica al pulsar "Ver resultados")
  const sim=()=>monB==='USD'?'USD':'S/';
  function actualizar(){
    // el botón muestra lo que se escribe: S/ 1+  /  S/ 1 - S/ 5  /  Hasta S/ 5
    const d=+desde.value||0,h=+hasta.value||0,s=sim();
    lbl.textContent=d&&h?`${s} ${fmt(d)} - ${s} ${fmt(h)}`:d?`${s} ${fmt(d)}+`:h?`Hasta ${s} ${fmt(h)}`:'Precio';
    any.setAttribute('aria-selected',!estado.desde&&!estado.hasta);
    f.querySelectorAll('.mo').forEach(b=>b.setAttribute('aria-selected',b.dataset.m===monB));
  }
  // al abrir, el panel vuelve a mostrar lo que está aplicado (lo escrito sin pulsar "Ver resultados" se descarta)
  function sincronizar(){
    monB=estado.mon;desde.value=estado.desde||'';hasta.value=estado.hasta||'';actualizar();
  }
  btn(f).addEventListener('click',()=>{if(!f.classList.contains('open'))sincronizar();alternar('precio')});
  any.addEventListener('click',()=>{
    estado.desde=estado.hasta=0;estado.mon='USD';sincronizar();cerrar();btn(f).focus();render();
  });
  f.querySelectorAll('.mo').forEach(b=>b.addEventListener('click',()=>{monB=b.dataset.m;actualizar()}));
  [desde,hasta].forEach(el=>{
    // solo números: se bloquea cualquier otro carácter al escribir y se limpia al pegar
    el.addEventListener('beforeinput',e=>{if(e.data&&/\D/.test(e.data))e.preventDefault()});
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');actualizar()});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ver.click()}});
  });
  ver.addEventListener('click',()=>{
    const d=+desde.value||0,h=+hasta.value||0;
    if(d||h){estado.desde=d;estado.hasta=h;estado.mon=monB}  // solo se aplica si se puso algún monto
    else{estado.desde=estado.hasta=0}                         // sin montos: sigue "Cualquier precio"
    sincronizar();cerrar();btn(f).focus();render();
  });
  f.addEventListener('keydown',e=>{
    if(e.key==='Escape'){cerrar();btn(f).focus()}
    else if(e.key==='ArrowDown'&&e.target===btn(f)){e.preventDefault();if(!f.classList.contains('open')){sincronizar();alternar('precio')}desde.focus()}
  });
  // si se cierra sin pulsar "Ver resultados", el botón vuelve a mostrar lo que está aplicado
  new MutationObserver(()=>{if(!f.classList.contains('open'))sincronizar()}).observe(f,{attributes:true,attributeFilter:['class']});
  sincronizar();
})();
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))cerrar()});

iniciarMapa();render();
$('#ubi').addEventListener('input',render);
// favoritos: funciona en la tarjeta de arriba y en las de abajo
document.addEventListener('click',e=>{const h=e.target.closest('.heart');if(!h)return;
  const id=+h.closest('.card').dataset.pid;fav.has(id)?fav.delete(id):fav.add(id);
  document.querySelectorAll(`.card[data-pid="${id}"] .heart`).forEach(x=>x.setAttribute('aria-pressed',fav.has(id)))});
// al pasar por una tarjeta de la lista se resalta su pin en el mapa
$('#list').addEventListener('pointerover',e=>{const c=e.target.closest('.card');if(c&&!(e.relatedTarget&&c.contains(e.relatedTarget)))resaltar(c.dataset.id,true)});
$('#list').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!(e.relatedTarget&&c.contains(e.relatedTarget)))resaltar(c.dataset.id,false)});
</script>
</body>
</html>
